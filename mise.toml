[tools]
helm = "4.3.2"
node = "26.13.1"
# Same as packageManager in package.json; CI gets pnpm from here.
pnpm = "12.23.0"

[tasks.download]
description = "Download the Kubernetes OpenAPI spec (tools/codegen)"
dir = "{{config_root}}/tools/codegen"
run = "pnpm download"

[tasks.generate]
description = "Generate @kube-ts/k8s from the downloaded spec (tools/codegen)"
dir = "{{config_root}}/tools/codegen"
run = "pnpm gen"
